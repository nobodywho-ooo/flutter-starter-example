name: flutter_starter_example
description: "See how to run NobodyWho in your Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  gpt_markdown: ^1.1.5
  http: ^1.6.0
  path_provider: ^2.1.5
  nobodywho: ^2.3.0
  shadcn_ui: ^0.54.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  lucide_icons_flutter: ^3.1.14+1 # temp fix for shadcn_ui, which use lucide_icons, affected by this issue: https://github.com/vqh2602/lucide-flutter-main/issues/18

flutter:
  uses-material-design: true
  assets:
    - assets/